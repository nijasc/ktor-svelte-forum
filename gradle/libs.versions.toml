[versions]
kotlin = "2.4.21"
ktor = "3.6.1"
ktor-svelte = "0.3.0"
logback = "1.6.6"
ktlint = "14.2.0"
exposed = "1.6.0"
hikari = "7.1.0"
postgresql = "42.7.14"
flyway = "13.12.0"
ideaExt = "1.4.1"
coroutines = "1.11.0"
serialization = "1.9.0"

[libraries]
# Build logic classpath
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
ktor-gradle-plugin = { module = "io.ktor.plugin:io.ktor.plugin.gradle.plugin", version.ref = "ktor" }
idea-ext-plugin = { module = "org.jetbrains.gradle.plugin.idea-ext:org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "ideaExt" }

# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

# Ktor server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-sessions = { module = "io.ktor:ktor-server-sessions", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# ktor-svelte runtime (Validated, ValidationException)
ktor-svelte-server = { module = "io.github.nijasc:ktor-svelte-server", version.ref = "ktor-svelte" }

# Persistence
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# Runtime
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[bundles]
# Every feature module that serves routes
ktor-feature = ["ktor-server-core", "ktor-svelte-server", "kotlinx-coroutines-core", "kotlinx-serialization-json"]
# The database module's own stack
persistence = ["exposed-core", "exposed-jdbc", "exposed-java-time", "hikari", "flyway-core"]
# Test dependencies for every module
testing = ["kotlin-test-junit5"]
ktor-testing = ["ktor-server-test-host", "kotlin-test-junit5"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "ideaExt" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
ktor-svelte = { id = "io.github.nijasc.ktor-svelte", version.ref = "ktor-svelte" }
